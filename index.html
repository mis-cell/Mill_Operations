<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bally Jute Mill &mdash; Department Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --ink:#211A14;
    --slate:#6B6055;
    --slate-light:#9C9186;
    --navy:#1F3B57;
    --navy-deep:#152A3F;
    --navy-pale:#EAF0F5;
    --gold:#B9822F;
    --gold-deep:#93692A;
    --gold-pale:#FBF1DE;
    --green:#3F8F6B;
    --green-pale:#d4f5e6;
    --red:#B3453B;
    --line:#E5E0D7;
    --white:#FFFFFF;
    --canvas:#F7F5F0;
    --shadow: 0 12px 32px rgba(31,42,63,0.10);
    --sidebar-w: 268px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--canvas);
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }
  .display{font-family:'Fraunces', serif;}
  .mono{font-family:'IBM Plex Mono', monospace; letter-spacing:.03em;}
  button{font:inherit;}
  svg{display:block;}


  .grid-bg{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(31,59,87,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(31,59,87,0.045) 1px, transparent 1px);
    background-size:48px 48px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 90%);
  }

  /* ================= GATE (LOGIN) ================= */
  .gate-outer{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
    position:relative; z-index:1;
  }
  .gate-wrap{width:100%; max-width:400px;}
  .gate-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:40px 36px 30px;
  }
  .gate-mark{
    width:46px; height:46px; margin:0 auto 18px;
    border-radius:10px;
    background:linear-gradient(155deg, var(--navy), var(--navy-deep));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Fraunces',serif; font-weight:600; font-size:16px;
    letter-spacing:.01em;
    box-shadow:0 6px 16px rgba(21,42,63,0.28);
  }
  .gate-eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:8px; text-align:center;
  }
  .gate-title{
    font-family:'Fraunces', serif; font-weight:600;
    font-size:26px; text-align:center; margin:0 0 4px;
    color:var(--ink);
  }
  .gate-sub{
    text-align:center; font-size:13px; color:var(--slate);
    margin:0 0 28px;
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block; font-size:11px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--slate); margin-bottom:6px; font-weight:600;
  }
  .field input{
    width:100%; padding:11px 13px; font-size:14.5px;
    border:1px solid var(--line); border-radius:8px;
    background:var(--white); color:var(--ink); font-family:'Inter',sans-serif;
    outline:none; transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus{border-color:var(--navy); box-shadow:0 0 0 3px var(--navy-pale);}
  .gate-btn{
    width:100%; padding:12px; margin-top:8px;
    background:var(--navy); color:#fff; border:none; border-radius:8px;
    font-family:'Inter',sans-serif; font-weight:600; font-size:14.5px;
    letter-spacing:.01em; cursor:pointer; transition:background .15s, transform .1s;
  }
  .gate-btn:hover{background:var(--navy-deep);}
  .gate-btn:active{transform:translateY(1px);}
  .gate-error{
    color:var(--red); font-size:12.5px; text-align:center; margin-top:12px; min-height:16px;
    font-weight:500;
  }
  .gate-hint{
    text-align:center; font-size:11px; color:var(--slate-light); margin-top:20px;
    border-top:1px solid var(--line); padding-top:14px; line-height:1.6;
  }

  /* ================= APP SHELL ================= */
  .app-shell{
    display:none;
    position:relative; z-index:1;
    min-height:100vh;
  }
  .app-shell.active{ display:flex; }
  .app-shell.sidebar-collapsed .sidebar{ display:none; }

  /* ---- sidebar ---- */
  .sidebar{
    width: var(--sidebar-w); flex:0 0 var(--sidebar-w);
    background:var(--white);
    border-right:1px solid var(--line);
    display:flex; flex-direction:column;
    height:100vh; position:sticky; top:0;
    padding:20px 14px 16px;
  }
  .side-brand{
    display:flex; align-items:center; gap:10px; padding:2px 6px 18px;
    border-bottom:1px solid var(--line); margin-bottom:14px;
  }
  .side-brand .mark{
    width:34px; height:34px; border-radius:9px;
    background:linear-gradient(155deg, var(--navy), var(--navy-deep));
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-weight:600; font-size:13px; flex-shrink:0;
  }
  .side-brand .name{font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; line-height:1.25;}
  .side-brand .sub{font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--slate-light); margin-top:2px;}

  .side-nav{flex:1; overflow-y:auto; padding-right:2px; position:relative;}
  .side-nav::-webkit-scrollbar{width:5px;}
  .side-nav::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .nav-item{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:9px 10px; border-radius:8px; cursor:pointer;
    font-size:13px; color:var(--ink); font-weight:500;
    margin-bottom:2px; transition:background .12s, color .12s;
    border:1px solid transparent;
  }
  .nav-item:hover{background:var(--navy-pale);}
  .nav-item.active{background:var(--navy); color:#fff;}
  .nav-item.active .nav-dot{background:#fff;}
  .nav-item.overview-item{
    font-family:'Fraunces',serif; font-weight:600; font-size:14px; margin-bottom:14px;
  }
  .nav-group{margin-bottom:4px; position:relative;}
  .nav-group-head{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--slate-light); padding:14px 10px 6px; display:flex; align-items:center; gap:7px;
    position:relative;
  }
  .nav-group:not(:last-child) .nav-group-head::after{
    content:'';
    position:absolute; left:17px; top:calc(100% + 2px); bottom:-8px; width:2px;
    background:linear-gradient(var(--gold-pale), var(--gold-pale));
    z-index:0;
  }
  .nav-group-head .num{
    width:17px; height:17px; border-radius:50%; background:var(--gold-pale); color:var(--gold-deep);
    display:flex; align-items:center; justify-content:center; font-size:8.5px; flex-shrink:0;
    position:relative; z-index:1; font-weight:600;
  }
  .nav-dot{
    width:6px; height:6px; border-radius:50%; background:#D9D3C8; flex-shrink:0;
  }
  .nav-item.linked .nav-dot{background:var(--green);}
  .nav-item.disabled{color:var(--slate-light); cursor:not-allowed;}
  .nav-item.disabled:hover{background:transparent;}

  .side-foot{border-top:1px solid var(--line); padding-top:12px; margin-top:8px;}
  .logout-btn-side{
    width:100%; background:var(--white); border:1px solid var(--line); color:var(--slate);
    padding:9px 12px; border-radius:8px; font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:600; cursor:pointer; transition:all .15s;
  }
  .logout-btn-side:hover{border-color:var(--red); color:var(--red);}

  /* ---- main area ---- */
  .main-area{flex:1 1 0%; min-width:0; display:flex; flex-direction:column; height:100vh; overflow:hidden;}
  .main-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 28px; border-bottom:1px solid var(--line); background:var(--white);
    gap:14px; flex-shrink:0;
  }
  .main-topbar.hidden{ display:none; }
  .topbar-left{display:flex; align-items:center; gap:12px; min-width:0;}
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px; flex-shrink:0;
    background:var(--white); border:1px solid var(--line); color:var(--slate);
    cursor:pointer; transition:all .15s;
  }
  .icon-btn:hover{border-color:var(--navy); color:var(--navy); background:var(--navy-pale);}
  .back-link{
    display:flex; align-items:center; gap:6px; color:var(--slate); font-size:12.5px;
    font-weight:600; cursor:pointer; padding:7px 10px 7px 8px; border-radius:7px; transition:all .15s;
    flex-shrink:0; white-space:nowrap;
  }
  .back-link:hover{background:var(--navy-pale); color:var(--navy);}
  .topbar-divider{width:1px; height:22px; background:var(--line); flex-shrink:0;}
  .topbar-title-block{min-width:0;}
  .topbar-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--gold-deep); margin-bottom:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .topbar-title-block h1{
    font-family:'Fraunces',serif; font-size:22px; margin:0; color:var(--ink); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .main-topbar.compact .topbar-eyebrow{font-size:9.5px; margin-bottom:2px;}
  .main-topbar.compact .topbar-title-block h1{font-size:16.5px;}
  .topbar-actions{display:flex; gap:10px; align-items:center; flex-shrink:0;}
  .tb-btn{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--white); border:1px solid var(--line); color:var(--slate);
    padding:9px 14px; border-radius:8px; font-family:'Inter',sans-serif;
    font-size:12.5px; font-weight:600; cursor:pointer; text-decoration:none; transition:all .15s;
    white-space:nowrap;
  }
  .tb-btn:hover{border-color:var(--navy); color:var(--navy);}
  .tb-btn.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  .tb-btn.primary:hover{background:var(--navy-deep);}

  .main-content{flex:1; overflow-y:auto; padding:26px 28px 40px; transition:padding .18s ease;}
  .main-content.flush{padding:0; overflow:hidden;}

  /* ---- overview: stat cards ---- */
  .stat-row{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px; margin-bottom:20px;
  }
  .stat-card{
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; box-shadow:0 2px 8px rgba(31,42,63,0.05);
    position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--gold);
  }
  .stat-card .stat-label{
    font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--slate-light); margin-bottom:8px;
  }
  .stat-card .stat-value{
    font-family:'Fraunces',serif; font-size:30px; font-weight:600; color:var(--ink); line-height:1;
  }
  .stat-card .stat-value.green{color:var(--green);}
  .stat-card .stat-sub{font-size:11.5px; color:var(--slate-light); margin-top:6px;}

  .chart-grid{
    display:grid; grid-template-columns: 1.4fr 1fr; gap:16px; margin-bottom:20px;
  }
  .chart-card{
    background:var(--white); border:1px solid var(--line); border-radius:10px;
    padding:20px 22px; box-shadow:0 2px 8px rgba(31,42,63,0.05);
  }
  .chart-card h3{
    font-family:'Fraunces',serif; font-size:15px; margin:0 0 2px; color:var(--ink); font-weight:600;
  }
  .chart-card .chart-note{font-size:11.5px; color:var(--slate-light); margin-bottom:14px;}
  .chart-card .chart-holder{position:relative; height:230px;}

  .status-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .status-table th{
    text-align:left; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--slate-light); padding:0 10px 8px 0; border-bottom:1px solid var(--line);
  }
  .status-table td{padding:9px 10px 9px 0; border-bottom:1px solid var(--line); color:var(--ink);}
  .status-table tr:last-child td{border-bottom:none;}
  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600;
    padding:3px 9px; border-radius:20px;
  }
  .pill.ok{background:var(--green-pale); color:var(--green);}
  .pill.pending{background:var(--gold-pale); color:var(--gold-deep);}

  .overview-footnote{
    font-size:11.5px; color:var(--slate-light); margin-top:4px; line-height:1.6;
  }

  /* ---- portal view (true full page) ---- */
  .portal-wrap{
    background:var(--white);
    height:100%;
    width:100%;
    position:relative;
  }
  .portal-frame{width:100%; height:100%; border:none; background:var(--white); display:block;}
  .portal-empty{
    height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--slate-light); text-align:center; padding:40px; gap:10px;
  }
  .portal-empty .display{font-size:18px; color:var(--slate); font-weight:600;}
  .portal-empty p{font-size:12.5px; max-width:340px; margin:0;}

  /* floating controls shown over a full-page portal */
  .float-controls{
    position:fixed; top:14px; left:14px; z-index:40;
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.9); backdrop-filter:blur(6px);
    border:1px solid var(--line); border-radius:10px;
    padding:5px; box-shadow:0 6px 18px rgba(31,42,63,0.14);
    opacity:0.55; transition:opacity .15s ease;
  }
  .float-controls:hover{opacity:1;}
  .float-controls .icon-btn{width:32px; height:32px; border:none; background:transparent;}
  .float-controls .icon-btn:hover{background:var(--navy-pale);}
  .float-controls .float-label{
    font-family:'Inter',sans-serif; font-size:12px; font-weight:600; color:var(--ink);
    padding:0 8px 0 4px; white-space:nowrap; max-width:180px; overflow:hidden; text-overflow:ellipsis;
    border-left:1px solid var(--line); margin-left:2px; padding-left:8px;
  }

  .float-hint{
    position:fixed; bottom:16px; left:50%; transform:translateX(-50%) translateY(6px);
    z-index:40; background:var(--ink); color:#fff; font-size:12px; font-weight:500;
    padding:9px 14px; border-radius:20px; box-shadow:0 8px 20px rgba(0,0,0,0.22);
    display:flex; align-items:center; gap:10px;
    opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
  }
  .float-hint.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
  .float-hint a{color:#F4CE8B; font-weight:700; text-decoration:none;}
  .float-hint .float-hint-close{
    cursor:pointer; color:rgba(255,255,255,0.6); font-size:14px; line-height:1; padding:2px;
  }
  .float-hint .float-hint-close:hover{color:#fff;}

  @media (max-width:880px){
    .app-shell{flex-direction:column;}
    .app-shell .sidebar{position:relative; height:auto; max-height:280px; width:100%; flex:0 0 auto;}
    .main-area{height:auto;}
    .chart-grid{grid-template-columns:1fr;}
    .main-content.flush{height:78vh;}
    .portal-wrap{height:78vh;}
    .topbar-title-block h1{max-width:38vw;}
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<!-- ================= LOGIN GATE ================= -->
<div class="gate-outer" id="gateOuter">
  <div class="gate-wrap">
    <div class="gate-card">
      <div class="gate-mark">BJM</div>
      <div class="gate-eyebrow">Internal Access</div>
      <h1 class="gate-title">Bally Jute Mill</h1>
      <p class="gate-sub">Department Portal &middot; Sign in to continue</p>

      <div class="field">
        <label for="user">Username</label>
        <input type="text" id="user" autocomplete="username" placeholder="admin">
      </div>
      <div class="field">
        <label for="pass">Password</label>
        <input type="password" id="pass" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;">
      </div>
      <button class="gate-btn" id="loginBtn">Enter Dashboard</button>
      <div class="gate-error" id="gateError"></div>

      <div class="gate-hint">All Rights Reserved</div>
    </div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div class="app-shell" id="appShell">
  <aside class="sidebar">
    <div class="side-brand">
      <div class="mark">BJM</div>
      <div>
        <div class="name">Bally Jute Mill</div>           
        <div class="sub">Department Portal</div>
      </div>
    </div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">
      <button class="logout-btn-side" id="logoutBtn">Log Out</button>
    </div>
  </aside>

  <main class="main-area">
    <div class="main-topbar" id="mainTopbar">
      <div class="topbar-left" id="topbarLeft">
        <button class="icon-btn" id="sidebarToggle" title="Show/hide sidebar" aria-label="Toggle sidebar">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <div id="backLinkSlot"></div>
        <div class="topbar-title-block">
          <div class="topbar-eyebrow" id="topbarEyebrow">Overview</div>
          <h1 id="topbarTitle">Portal Dashboard</h1>
        </div>
      </div>
      <div class="topbar-actions" id="topbarActions"></div>
    </div>
    <div class="main-content" id="mainContent"></div>
  </main>
</div>

<script>
  // ============ CREDENTIALS (edit here) ============
  //const CREDENTIALS = {username: "Ankana", password: "ankana@1234"};
  const CREDENTIALS = { username: "admin", password: "1234" };

  // ============ DEPARTMENTS (grouped by production stage) ============
  // Paste each department's Google Apps Script web app URL into the
  // corresponding "url" field below, between the quotes.
  // Example:  url: "https://script.google.com/macros/s/AKfycb.../exec"
  const STAGES = [
    {
      name: "Fibre Preparation",
      note: "Raw jute processing",
      depts: [
        { title: "Carding Department", url: "https://script.google.com/macros/s/AKfycbypegVeA1JwrjngyW-CiM1NZ5wB0K9TaRHhUi8l_Cq_bePwEXIOLdwGegWrv7oVPojJlw/exec" },
        { title: "Spinning",            url: "https://script.google.com/macros/s/AKfycbxWvHm0nq2iUmZxqsl6NG8earrtDGXd8pPcDsfxWK9vLOP7PSigwBbh_7kj90Vp9Dcg/exec" },
        { title: "Spreading",           url: "https://script.google.com/macros/s/AKfycbzUaDHReTbsghmsdCo24EaF3vhx3E87PwiQ3kphcP-X-hG4zzfonbYHArM_vaJqOHCe/exec" },
      ]
    },
    {
      name: "Beaming",
      note: "Warp preparation",
      depts: [
        { title: "S4 Beaming",     url: "https://script.google.com/macros/s/AKfycbys_A8kjzM7rD37wsbwuN1lORI2KP8z2vWGaH8bRniPLRQ_InXoZ_eDJZPpyM3999_L/exec" },
        { title: "VL Beam",        url: "https://script.google.com/macros/s/AKfycbwB4MEX8PtBD-ht9dBDjhY6gJWEMDwjRNFjGoWhJiF7aZe9REByqPLvWKJt1eSzJdedKA/exec" },
        { title: "Pre Beam",       url: "https://script.google.com/macros/s/AKfycbwmKsy3Zc-7NsZgh5KMMXkLnnCgltceju1gKqnc6Opohe2uCKpIpSTJ6OvSL6CwTdyQ/exec" },
        { title: "Narrow Beam",    url: "https://script.google.com/macros/s/AKfycbwQobns3wyD5tccCX6rVDMN5i0CUVdtg7s4iANSnv8VrAkqcn3QGk-w6JiFbsxgiJmlGg/exec" },
      ] 
    },
    {
      name: "Weaving (Loom)",
      note: "Cloth formation",
      depts: [
        { title: "S4 Loom Department",      url: "https://script.google.com/macros/s/AKfycbwdLR5cuFe2ky7AoX7SV_coqP39QAl5V8V1B9mey7LkMPAyMRtOav42_p6AvozTMV9H6Q/exec" },
        { title: "Victor Loom Department",  url: "https://script.google.com/macros/s/AKfycbwgu8tKEmuDNxX5aYWyp0KOiZfaO7_-iad0b9oy0s35AkFemQuA71aFXlbUxghRlqqq/exec" },
        { title: "Narrow Loom Department",  url: "https://script.google.com/a/macros/ballyjute.com/s/AKfycbwxjn-jrhdfDnXqdjAzIiID2rNzR2_T5F4iUmqL1zdTRWp93fwIdh4Mb4_dop1XE0vV/exec" },
      ]
    },
    {
      name: "Finishing - Sacking" ,
      note: "Final processing and dispatch",
      depts: [
        {title:  "Herackle production",   url:"https://script.google.com/a/macros/ballyjute.com/s/AKfycbzhIxUkD0fEErwSU_0kWh4cKKk1024OByXgV24LAdKkgkXNTouF7sk_PBiCXVhf7VNI/exec"},
        {title:  "Hemming Department",      url:"https://script.google.com/a/macros/ballyjute.com/s/AKfycbzfw8YQvXYxIhIpmgTXPmDscKHXBxUss8lkT5TTpyfS4kJtpbEYsIDbq4ggl_CsvfJQ/exec"},
        {title:  "Damping Department",     url:"https://script.google.com/a/macros/ballyjute.com/s/AKfycbxq0-3a4AfqC_qgqzSwj0DBswqPiJo9EJoCcP8fxcy21PhCyytGhdWk1BUzQ6vwouisgA/exec"},
      ]
    },
  {
    name: "Finishing - Hessian",
    note: "Final processing and dispatch",
    depts: [
      { title: "Lapping Production",    url:"https://script.google.com/a/macros/ballyjute.com/s/AKfycbyvQfFoT8oFTHug63HKXlBGvPpdx61ERVwdg1IOilPno_KAVQNe_6tagQLPLBxgYWdt/exec"},
      {title : "Pessing Production",    url:"https://script.google.com/macros/s/AKfycbyxZvMNJB0vQiIhOtLQOP22oVxkUgSmyocQHjrwwcgPStaS6_8lllnnVKUeC9b1rYwd/exec"},

    ]
  }

   
  ];

  // ============ state ============
  let currentView = "overview"; // "overview" | dept key
  let barChart = null, donutChart = null;
  let sidebarCollapsed = false;

  // ============ login ============
  const gateOuter = document.getElementById('gateOuter');
  const appShell = document.getElementById('appShell');
  const gateError = document.getElementById('gateError');

  function attemptLogin(){
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value;
    if(u === CREDENTIALS.username && p === CREDENTIALS.password){
      sessionStorage.setItem('bjm_authed', '1');
      showDashboard();
    } else {
      gateError.textContent = "Incorrect username or password. Try again.";
    }
  }
  document.getElementById('loginBtn').addEventListener('click', attemptLogin);
  ['user','pass'].forEach(id=>{
    document.getElementById(id).addEventListener('keydown', e=>{
      if(e.key === 'Enter') attemptLogin();
    });
  });
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    sessionStorage.removeItem('bjm_authed');
    appShell.classList.remove('active');
    gateOuter.style.display = 'flex';
    document.getElementById('pass').value = '';
    gateError.textContent = '';
  });

  function showDashboard(){
    gateOuter.style.display = 'none';
    appShell.classList.add('active');
    renderSidebar();
    renderOverview();
  }

  // ============ sidebar collapse ============
  function setSidebarCollapsed(collapsed){
    sidebarCollapsed = collapsed;
    appShell.classList.toggle('sidebar-collapsed', collapsed);
  }
  document.getElementById('sidebarToggle').addEventListener('click', ()=>{
    setSidebarCollapsed(!sidebarCollapsed);
  });

  // ============ helpers ============
  function deptKey(si, di){ return si + '-' + di; }

  function allDepts(){
    const out = [];
    STAGES.forEach((stage, si) => {
      stage.depts.forEach((dept, di) => {
        out.push({ stage: stage.name, si, di, key: deptKey(si,di), title: dept.title, url: (dept.url||'').trim() });
      });
    });
    return out;
  }

  // ============ sidebar ============
  const sideNav = document.getElementById('sideNav');

  function renderSidebar(){
    sideNav.innerHTML = '';

    const overviewItem = document.createElement('div');
    overviewItem.className = 'nav-item overview-item' + (currentView === 'overview' ? ' active' : '');
    overviewItem.textContent = 'Overview';
    overviewItem.addEventListener('click', () => { currentView = 'overview'; renderSidebar(); renderOverview(); });
    sideNav.appendChild(overviewItem);

    STAGES.forEach((stage, si) => {
      const group = document.createElement('div');
      group.className = 'nav-group';
      const head = document.createElement('div');
      head.className = 'nav-group-head';
      head.innerHTML = `<span class="num">${String(si+1).padStart(2,'0')}</span> ${stage.name}`;
      group.appendChild(head);

      stage.depts.forEach((dept, di) => {
        const key = deptKey(si, di);
        const url = (dept.url || '').trim();
        const item = document.createElement('div');
        item.className = 'nav-item' + (url ? ' linked' : ' disabled') + (currentView === key ? ' active' : '');
        item.innerHTML = `<span>${dept.title}</span><span class="nav-dot"></span>`;
        item.addEventListener('click', () => {
          currentView = key;
          renderSidebar();
          renderPortal(stage.name, dept, url);
        });
        group.appendChild(item);
      });
      sideNav.appendChild(group);
    });
  }

  // ============ topbar helpers ============
  function setTopbar(opts){
    const { eyebrow, title, actionsHtml } = opts;
    document.getElementById('mainTopbar').classList.remove('hidden');
    document.getElementById('topbarEyebrow').textContent = eyebrow;
    document.getElementById('topbarTitle').textContent = title;
    document.getElementById('topbarActions').innerHTML = actionsHtml || '';
    document.getElementById('backLinkSlot').innerHTML = '';
  }

  const backArrowSvg = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M10 3.5 5 8l5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const menuSvg = `<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  const externalSvg = `<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M6 3H3v10h10v-3M9 3h4v4M13 3 7 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  let hintTimer = null;
  function clearFloatingUI(){
    if(hintTimer){ clearTimeout(hintTimer); hintTimer = null; }
    const existingControls = document.querySelector('.float-controls');
    if(existingControls) existingControls.remove();
    const existingHint = document.querySelector('.float-hint');
    if(existingHint) existingHint.remove();
  }


  // ============ overview (reports & graphs) ============
  function renderOverview(){
    clearFloatingUI();
    setSidebarCollapsed(false);
    const depts = allDepts();
    const total = depts.length;
    const linked = depts.filter(d => d.url).length;
    const pct = total ? Math.round((linked/total)*100) : 0;

    setTopbar({
      eyebrow: 'Bally Jute Mill · Internal Systems',
      title: 'Portal Dashboard',
      compact: false
    });

    const mainContent = document.getElementById('mainContent');
    mainContent.classList.remove('flush');
    mainContent.innerHTML = `
      <div class="stat-row">
        <div class="stat-card">
          <div class="stat-label">Stages</div>
          <div class="stat-value">${STAGES.length}</div>
          <div class="stat-sub">Production stages tracked</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Departments</div>
          <div class="stat-value">${total}</div>
          <div class="stat-sub">Across all stages</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Portals Linked</div>
          <div class="stat-value green">${linked}</div>
          <div class="stat-sub">${total - linked} pending setup</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Setup Completion</div>
          <div class="stat-value">${pct}%</div>
          <div class="stat-sub">Of departments have a live link</div>
        </div>
      </div>

      <div class="chart-grid">
        <div class="chart-card">
          <h3>Departments by Stage</h3>
          <div class="chart-note">Linked vs. not-yet-linked departments in each production stage</div>
          <div class="chart-holder"><canvas id="stageBarChart"></canvas></div>
        </div>
        <div class="chart-card">
          <h3>Portal Link Status</h3>
          <div class="chart-note">Share of departments with an active portal link</div>
          <div class="chart-holder"><canvas id="linkDonutChart"></canvas></div>
        </div>
      </div>

      <div class="chart-card">
        <h3>Stage Breakdown</h3>
        <div class="chart-note">Link status by production stage</div>
        <table class="status-table">
          <thead>
            <tr><th>Stage</th><th>Departments</th><th>Linked</th><th>Status</th></tr>
          </thead>
          <tbody id="stageTableBody"></tbody>
        </table>
        <div class="overview-footnote">Charts reflect portal configuration in this dashboard, not live production output. Wire up department portals via the <code>STAGES</code> list in the HTML file to keep this current.</div>
      </div>
    `;

    // table
    const tbody = document.getElementById('stageTableBody');
    STAGES.forEach(stage => {
      const t = stage.depts.length;
      const l = stage.depts.filter(d => (d.url||'').trim()).length;
      const full = l === t && t > 0;
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${stage.name}</td>
        <td>${t}</td>
        <td>${l}</td>
        <td><span class="pill ${full ? 'ok' : 'pending'}">${full ? 'Fully linked' : (l+'/'+t+' linked')}</span></td>
      `;
      tbody.appendChild(row);
    });

    drawCharts();
  }

  function drawCharts(){
    if(typeof Chart === 'undefined') return;
    if(barChart){ barChart.destroy(); barChart = null; }
    if(donutChart){ donutChart.destroy(); donutChart = null; }

    const labels = STAGES.map(s => s.name);
    const linkedCounts = STAGES.map(s => s.depts.filter(d => (d.url||'').trim()).length);
    const pendingCounts = STAGES.map((s, i) => s.depts.length - linkedCounts[i]);

    const barCtx = document.getElementById('stageBarChart');
    if(barCtx){
      barChart = new Chart(barCtx, {
        type: 'bar',
        data: {
          labels,
          datasets: [
            { label: 'Linked', data: linkedCounts, backgroundColor: '#3F8F6B', borderRadius: 4, maxBarThickness: 34 },
            { label: 'Not Linked', data: pendingCounts, backgroundColor: '#E5DFD2', borderRadius: 4, maxBarThickness: 34 },
          ]
        },
        options: {
          responsive:true, maintainAspectRatio:false,
          scales:{
            x:{ stacked:true, grid:{ display:false }, ticks:{ font:{ family:'Inter', size:11 } } },
            y:{ stacked:true, beginAtZero:true, ticks:{ stepSize:1, font:{ family:'Inter', size:11 } }, grid:{ color:'#E5E0D7' } }
          },
          plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ family:'Inter', size:11 } } } }
        }
      });
    }

    const depts = allDepts();
    const linkedTotal = depts.filter(d => d.url).length;
    const pendingTotal = depts.length - linkedTotal;

    const donutCtx = document.getElementById('linkDonutChart');
    if(donutCtx){
      donutChart = new Chart(donutCtx, {
        type: 'doughnut',
        data: {
          labels: ['Linked', 'Not Linked'],
          datasets: [{ data: [linkedTotal, pendingTotal], backgroundColor: ['#3F8F6B', '#E5DFD2'], borderWidth: 0 }]
        },
        options: {
          responsive:true, maintainAspectRatio:false, cutout:'68%',
          plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{ family:'Inter', size:11 } } } }
        }
      });
    }
  }

  // ============ portal view (true full page) ============
  function renderPortal(stageName, dept, url){
    clearFloatingUI();
    setSidebarCollapsed(true);
    document.getElementById('mainTopbar').classList.add('hidden');

    const mainContent = document.getElementById('mainContent');
    mainContent.classList.add('flush');

    if(!url){
      mainContent.innerHTML = `
        <div class="portal-wrap">
          <div class="portal-empty">
            <div class="display">No portal linked yet</div>
            <p>Add this department's Google Apps Script web app URL to the <code>STAGES</code> list in the HTML file to enable it here.</p>
          </div>
        </div>
      `;
      injectFloatControls(stageName, dept, url);
      return;
    }

    mainContent.innerHTML = `
      <div class="portal-wrap">
        <iframe class="portal-frame" src="${escapeAttr(url)}" title="${escapeAttr(dept.title)}"></iframe>
      </div>
    `;
    injectFloatControls(stageName, dept, url);

    // Unobtrusive fallback: if some Apps Script portals refuse to be framed,
    // nudge the person toward "Open in New Tab" after a short delay instead
    // of permanently occupying space with a banner.
    hintTimer = setTimeout(() => {
      const hint = document.createElement('div');
      hint.className = 'float-hint';
      hint.innerHTML = `
        <span>Portal not showing? <a href="${escapeAttr(url)}" target="_blank" rel="noopener">Open in new tab</a></span>
        <span class="float-hint-close" title="Dismiss">&times;</span>
      `;
      document.body.appendChild(hint);
      requestAnimationFrame(() => hint.classList.add('show'));
      hint.querySelector('.float-hint-close').addEventListener('click', () => hint.remove());
    }, 2800);
  }

  function injectFloatControls(stageName, dept, url){
    const controls = document.createElement('div');
    controls.className = 'float-controls';
    controls.innerHTML = `
      <button class="icon-btn" id="floatMenuBtn" title="Show sidebar" aria-label="Show sidebar">${menuSvg}</button>
      <button class="icon-btn" id="floatBackBtn" title="Back to overview" aria-label="Back to overview">${backArrowSvg}</button>
      <span class="float-label">${escapeHtml(dept.title)}</span>
      ${url ? `<a class="icon-btn" href="${escapeAttr(url)}" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">${externalSvg}</a>` : ''}
    `;
    document.body.appendChild(controls);
    document.getElementById('floatMenuBtn').addEventListener('click', () => setSidebarCollapsed(!sidebarCollapsed));
    document.getElementById('floatBackBtn').addEventListener('click', () => { currentView = 'overview'; renderSidebar(); renderOverview(); });
  }

  function escapeAttr(s){
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
  }
  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ============ resume session ============
  if(sessionStorage.getItem('bjm_authed') === '1'){
    showDashboard();
  }
</script>
</body>
</html>
